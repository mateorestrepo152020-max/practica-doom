<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 3: El mayor de tres números</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 3: El mayor de tres números</h1>
        <p>Ingresa tres números para descubrir cuál es el mayor o si son iguales.</p>
    </header>

    <main>
        <form id="formTaller3" novalidate>
            <label for="numeroA">Número A:</label>
            <input type="number" step="any" id="numeroA">

            <label for="numeroB">Número B:</label>
            <input type="number" step="any" id="numeroB">

            <label for="numeroC">Número C:</label>
            <input type="number" step="any" id="numeroC">

            <div class="botones">
                <input type="submit" value="Calcular mayor">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller3.js"></script>
</body>
</html>
