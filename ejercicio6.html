<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 6 · Menú de cajero simple</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    header a { color: #1a73e8; text-decoration: none; }
    section { margin: 1.5rem 0; padding: 1rem; background: #f8fafc; border-radius: 8px; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    textarea { width: 100%; padding: 0.5rem; font-family: monospace; }
    button { margin-top: 0.75rem; padding: 0.6rem 1.2rem; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Volver al menú</a>
    <h1>Ejercicio 6: Menú de cajero simple</h1>
    <p>do...while · Menú</p>
  </header>
  <main>
    <section id="enunciado">
      <h2>Enunciado</h2>
      <p>Mostrar un menú de cajero al menos una vez usando <strong>do...while</strong>. Opciones: 1. Consultar, 2. Depositar, 3. Retirar, 4. Salir. Procesar una secuencia de opciones.</p>
    </section>
    <section id="controles">
      <form id="formulario">
        <label for="entrada">Opciones separadas por comas (1-4). Ejemplo: 1,2,3,4</label>
        <textarea id="entrada" rows="2" required placeholder="1,2,150,3,50,4"></textarea>
        <button type="submit">Ejecutar menú</button>
      </form>
    </section>
    <section id="resultado">
      <h2>Resultados</h2>
      <p id="mensaje">Aún no hay datos.</p>
      <ul id="log"></ul>
      <p>Saldo final: <strong id="saldo">—</strong></p>
    </section>
  </main>
  <script src="ejercicio6.js"></script>
</body>
</html>
