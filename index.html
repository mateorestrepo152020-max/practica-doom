<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía: Ciclos en JavaScript - Menú</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { color: #1a73e8; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.5rem 0; }
    a { display: block; padding: 0.75rem 1rem; background: #f0f4f8; border-radius: 8px; text-decoration: none; color: #1a73e8; font-weight: 500; }
    a:hover { background: #e0e7ff; }
    .tags { font-size: 0.85rem; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>Guía: Ciclos en JavaScript</h1>
    <p>Menú principal generado con un ciclo</p>
  </header>
  <main>
    <ul id="menu"></ul>
  </main>
  <script>
    // Generar menú con ciclo for
    const ejercicios = [
      { num: 1, titulo: "Suma de números positivos", tags: "while · Acumuladores" },
      { num: 2, titulo: "Tabla de multiplicar", tags: "for · Contadores" },
      { num: 3, titulo: "Promedio de notas", tags: "for · Validación" },
      { num: 4, titulo: "Registro de ventas", tags: "while · Validación" },
      { num: 5, titulo: "Inicio de sesión (bandera)", tags: "while · Bandera" },
      { num: 6, titulo: "Menú de cajero simple", tags: "do...while · Menú" },
      { num: 7, titulo: "Nómina de empleados", tags: "for · Condiciones · Acumuladores" },
      { num: 8, titulo: "Juego de adivinar el número", tags: "while · Condiciones · Contadores" },
      { num: "reto", titulo: "Reto final: Cajero automático", tags: "do...while · Bandera · Acumuladores" }
    ];

    const menu = document.getElementById("menu");
    for (let i = 0; i < ejercicios.length; i++) {
      const ej = ejercicios[i];
      const li = document.createElement("li");
      const href = ej.num === "reto" ? "reto.html" : `ejercicio${ej.num}.html`;
      li.innerHTML = `<a href="${href}">${ej.num === "reto" ? "Reto" : "Ejercicio " + ej.num}: ${ej.titulo}<br><span class="tags">${ej.tags}</span></a>`;
      menu.appendChild(li);
    }
  </script>
</body>
</html>
